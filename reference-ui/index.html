<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A responsive Procurement frontend prototype. Shared workflows, RFQs, purchasing, payables, and settings using fictional local data." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" href="/procurement/workspace/favicon.svg" type="image/svg+xml" />
    <title>Procurement · ERP</title>
    <style>
      .erp-global-preloader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#fff;opacity:1;transition:opacity 260ms ease}
      .erp-global-preloader.is-leaving{opacity:0;pointer-events:none}
      .erp-preloader-orbit{position:relative;display:grid;place-items:center;width:104px;height:104px;border-radius:50%}
      .erp-preloader-orbit::before{position:absolute;inset:0;content:"";border:3px solid #e8f0f5;border-top-color:var(--primary,#012642);border-radius:50%;animation:erp-preloader-turn 3s linear infinite}
      .erp-preloader-fallback,.erp-preloader-logo{width:72px;height:72px;border-radius:50%;object-fit:contain}
      .erp-preloader-fallback{display:grid;place-items:center;background:var(--primary,#012642);color:#fff;font:700 18px/1 Arial,sans-serif;letter-spacing:.04em}
      .erp-preloader-logo{padding:7px}
      .erp-preloader-logo[hidden],.erp-preloader-fallback[hidden]{display:none}
      @keyframes erp-preloader-turn{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.erp-preloader-orbit::before{animation:none}}
    </style>
  </head>
  <body>
    <div id="erp-global-preloader" class="erp-global-preloader" role="status" aria-label="Loading ERP">
      <div class="erp-preloader-orbit" aria-hidden="true">
        <span id="erp-preloader-fallback" class="erp-preloader-fallback">ERP</span>
        <img id="erp-preloader-logo" class="erp-preloader-logo" alt="" hidden />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
